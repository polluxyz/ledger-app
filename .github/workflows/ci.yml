name: CI

# 何時觸發這個 workflow
on:
  pull_request:
    branches: [main] # 任何指向 main 的 PR
  push:
    branches: [main] # 合併進 main 之後再驗一次

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest # GitHub 提供的 Linux runner

    # e2e 測試需要真的 PostgreSQL；用 service container 起一顆，附帶 ledger_test 資料庫
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        # 等 Postgres 就緒再往下跑
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. 把這個 repo 的程式碼抓進 runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 pnpm（版本與 package.json 的 packageManager 一致）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      # 3. 安裝 Node（版本讀 .node-version），並開啟 pnpm 相依快取
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # 4. 依 lockfile 安裝相依（--frozen-lockfile：lockfile 與 package.json 不符就直接失敗）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 先建置 shared：它的型別宣告在 dist/，api 的 typecheck 與 test 都依賴它
      - name: Build shared package
        run: pnpm --filter @ledger/shared build

      # 6.~10. 由快到慢、由淺到深，任一步失敗就中止並回報
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # e2e 有兩套，都對上面的 Postgres service 跑，而且共用同一個 ledger_test。
      # 這裡是**序列**步驟，不會互相清資料；本機則不可同時跑（見 README）。
      # 兩套的 globalSetup 都會先套用 migration；DATABASE_URL / JWT_SECRET 由各步
      # 注入（本地則讀 .env.test）。

      # 第一套：supertest 打 NestJS 應用程式，不開瀏覽器。
      - name: API E2E (supertest)
        run: pnpm --filter @ledger/api test:e2e
        env:
          DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test
          JWT_SECRET: ci-e2e-secret-not-used-in-production

      # 瀏覽器約 150 MB，每次重下載會讓 CI 明顯變慢。key 掛 lockfile 的 hash：
      # Playwright 版本記在 lockfile 裡，版本一變就自然換一個 key。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps 一併裝 Chromium 需要的系統套件（runner 預設沒有）。
      - name: Install Chromium
        run: pnpm --filter @ledger/web exec playwright install --with-deps chromium

      # 第二套：真的開 Chromium 打真的 API。Playwright 自己起兩個伺服器
      # （API 3100、web 5273），跑完自動關掉。
      - name: Web E2E (Playwright)
        run: pnpm --filter @ledger/web test:e2e
        env:
          DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test
          JWT_SECRET: ci-e2e-secret-not-used-in-production

      # 只在失敗時上傳。成功時那份報告沒人會看，卻每次都佔額度。
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
