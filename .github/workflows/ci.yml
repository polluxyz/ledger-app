name: CI

# 何時觸發這個 workflow
on:
  pull_request:
    branches: [main] # 任何指向 main 的 PR
  push:
    branches: [main] # 合併進 main 之後再驗一次

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest # GitHub 提供的 Linux runner

    # e2e 測試需要真的 PostgreSQL；用 service container 起一顆，附帶 ledger_test 資料庫
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        # 等 Postgres 就緒再往下跑
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. 把這個 repo 的程式碼抓進 runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 pnpm（版本與 package.json 的 packageManager 一致）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      # 3. 安裝 Node（版本讀 .node-version），並開啟 pnpm 相依快取
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # 4. 依 lockfile 安裝相依（--frozen-lockfile：lockfile 與 package.json 不符就直接失敗）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 先建置 shared：它的型別宣告在 dist/，api 的 typecheck 與 test 都依賴它
      - name: Build shared package
        run: pnpm --filter @ledger/shared build

      # 6.~10. 由快到慢、由淺到深，任一步失敗就中止並回報
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # e2e：對上面的 Postgres service 跑真實 API 流程。globalSetup 會先套用
      # migration；DATABASE_URL / JWT_SECRET 由此步注入（本地則讀 .env.test）。
      - name: E2E test
        run: pnpm --filter @ledger/api test:e2e
        env:
          DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test
          JWT_SECRET: ci-e2e-secret-not-used-in-production
